          "NONE_ALT": 3
  - name: SYS_OFF_A
    addr: 0x13
    width: 3
    access: rw
    reset: 0x000000
    reset_source: hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.60"
