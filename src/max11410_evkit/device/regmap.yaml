# MAX11410 register map - transcribed from the MAX11410 datasheet (rev 3, 10/19),
# "Register Map" section pp. 38-90, plus reset values measured on the MAX11410EVKIT.
#
# Register keys:
#   name, addr, width (bytes), access (rw | r), reset (int or null)
#   reset_source:    datasheet | hardware | datasheet+hardware  (where the reset value comes from)
#   measured_reset:  value read on the EVKIT when it differs from the datasheet reset
#   confirmed:       name/address/width/fields checked against the datasheet
#   reset_confirmed: reset value stated by the datasheet or measured on hardware
#   volatile:        hardware changes it, or reading has side effects -> never served from cache
#   trigger:         writing starts an action -> skipped by write_all
#   page, description, notes
# Field keys: name, bits ("7:4" or "3"), access (rw | r | rc = read, clears on STATUS read),
#   values (enum name -> int), aliases (older/driver names accepted on lookup), description.
# Fields are listed MSB first, as in the datasheet.
#
# SPI address byte: bit 7 = R/WB (1 = read, 0 = write), bits 6:0 = REG_ADDR (datasheet p.38).
# Widths: 0x00-0x10 8-bit, 0x11-0x39 24-bit, 0x3A-0x6F 16-bit (sequencer).
# Datasheet names use the micro sign (uC0..uC52, uCADDR); this file spells them UC0..UC52, UCADDR.
version: 2
registers:

  - name: PD
    addr: 0x00
    width: 1
    access: rw
    reset: 0x02
    reset_source: datasheet
    measured_reset: 0x01
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.40"
    description: "Power-down state. During wakeup PD reads 0b10, then 0b00 when the wakeup timer expires."
    notes: "EVKIT reads 0x01 (standby) after power-up, not the datasheet POR value 0x2 (sleep); a PD=RESET (0b11) self-clears to 0b01, which would explain it."
    fields:
      - name: PD
        bits: "1:0"
        access: rw
        confirmed: true
        description: "Power mode."
        values:
          "NORMAL": 0
          "STANDBY": 1
          "SLEEP": 2
          "RESET": 3
  - name: CONV_START
    addr: 0x01
    width: 1
    access: rw
    reset: 0x00
    reset_source: hardware
    reset_confirmed: true
    confirmed: true
    volatile: true
    trigger: true
    source: "datasheet rev3 p.40"
    description: "Writing starts a conversion of type CONV_TYPE stored in DATA[DEST]. Writing it while in standby/sleep wakes the part (PD -> normal) first."
    fields:
      - name: DEST
        bits: "6:4"
        access: rw
        confirmed: true
        description: "Destination data register."
        values:
          "DATA0": 0
          "DATA1": 1
          "DATA2": 2
          "DATA3": 3
          "DATA4": 4
          "DATA5": 5
          "DATA6": 6
          "DATA7": 7
      - name: CONV_TYPE
        bits: "1:0"
        access: rw
        confirmed: true
        description: "Conversion type (0b10 and 0b11 are both 1:4 duty-cycled, modulator low-power mode)."
        values:
          "SINGLE": 0
          "CONTINUOUS": 1
          "DUTY_CYCLE": 2
          "DUTY_CYCLE_ALT": 3
  - name: SEQ_START
    addr: 0x02
    width: 1
    access: rw
    reset: 0x3A
    reset_source: hardware
    reset_confirmed: true
    confirmed: true
    volatile: true
    trigger: true
    source: "datasheet rev3 p.41"
    description: "Writing starts the sequencer at SEQ_ADDR (0x3A-0x6E; other addresses are ignored). Inside a sequence it acts as GOTO. Writing it while in standby/sleep wakes the part (PD -> normal) first."
    fields:
      - name: SEQ_ADDR
        bits: "6:0"
        access: rw
        confirmed: true
        description: "Sequencer start address."
  - name: CAL_START
    addr: 0x03
    width: 1
    access: rw
    reset: 0x00
    reset_source: hardware
    reset_confirmed: true
    confirmed: true
    volatile: true
    trigger: true
    source: "datasheet rev3 p.41"
    description: "Writing runs the calibration selected by CAL_TYPE at the current LINEF/RATE; completion sets STATUS.CAL_RDY. Writing it while in standby/sleep wakes the part (PD -> normal) first."
    fields:
      - name: CAL_TYPE
        bits: "2:0"
        access: rw
        confirmed: true
        description: "SELF -> SELF_OFF + SELF_GAIN_1; PGA -> SELF_GAIN_<gain> (no-op at gain 1 or without the PGA path); SYS_* -> system offset/gain registers A or B. 2,3 reserved."
        values:
          "SELF": 0
          "PGA": 1
          "SYS_OFF_A": 4
          "SYS_GAIN_A": 5
          "SYS_OFF_B": 6
          "SYS_GAIN_B": 7
  - name: GP0_CTRL
    addr: 0x04
    width: 1
    access: rw
    reset: 0x00
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.42"
    description: "GPIO0 configuration. 0xC1 = CMOS output driving INTRB (active-low data-ready interrupt). EXTCLK=1 overrides GP0_CTRL."
    fields:
      - name: GP0_DIR
        bits: "7:6"
        access: rw
        confirmed: true
        description: "Direction. 1 is reserved."
        values:
          "INPUT": 0
          "OPEN_DRAIN": 2
          "CMOS": 3
      - name: GP0_ISEL
        bits: "5:4"
        access: rw
        confirmed: true
        description: "Input function (rising edge). 3 is reserved."
        values:
          "DISABLED": 0
          "CONV_START": 1
          "SEQ_START": 2
      - name: GP0_OSEL
        bits: "2:0"
        access: rw
        confirmed: true
        description: "Output function."
        values:
          "DISABLED": 0
          "INTRB": 1
          "INTR": 2
          "LOGIC0": 3
          "LOGIC1": 4
          "LOW_SIDE_SWITCH": 5
          "MOD_ACTIVE": 6
          "SYSCLK": 7
  - name: GP1_CTRL
    addr: 0x05
    width: 1
    access: rw
    reset: 0x00
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.43"
    description: "GPIO1 configuration. 0xC1 = CMOS output driving INTRB (active-low data-ready interrupt)."
    fields:
      - name: GP1_DIR
        bits: "7:6"
        access: rw
        confirmed: true
        description: "Direction. 1 is reserved."
        values:
          "INPUT": 0
          "OPEN_DRAIN": 2
          "CMOS": 3
      - name: GP1_ISEL
        bits: "5:4"
        access: rw
        confirmed: true
        description: "Input function (rising edge). 3 is reserved."
        values:
          "DISABLED": 0
          "CONV_START": 1
          "SEQ_START": 2
      - name: GP1_OSEL
        bits: "2:0"
        access: rw
        confirmed: true
        description: "Output function."
        values:
          "DISABLED": 0
          "INTRB": 1
          "INTR": 2
          "LOGIC0": 3
          "LOGIC1": 4
          "LOW_SIDE_SWITCH": 5
          "MOD_ACTIVE": 6
          "SYSCLK": 7
  - name: GP_CONV
    addr: 0x06
    width: 1
    access: rw
    reset: 0x00
    reset_source: hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.44"
    description: "Conversion type and destination used when a GPIO starts a conversion (writing does not start one)."
    fields:
      - name: GP_DEST
        bits: "6:4"
        access: rw
        confirmed: true
        description: "Destination data register."
        values:
          "DATA0": 0
          "DATA1": 1
          "DATA2": 2
          "DATA3": 3
          "DATA4": 4
          "DATA5": 5
          "DATA6": 6
          "DATA7": 7
      - name: GP_CONV_TYPE
        bits: "1:0"
        access: rw
        confirmed: true
        description: "Conversion type."
        values:
          "SINGLE": 0
          "CONTINUOUS": 1
          "DUTY_CYCLE": 2
          "DUTY_CYCLE_ALT": 3
  - name: GP_SEQ_ADDR
    addr: 0x07
    width: 1
    access: rw
    reset: 0x3A
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.44"
    description: "Sequencer address used when a GPIO starts a sequence (valid 0x3A-0x6F)."
    fields:
      - name: GP_SEQ_ADDR
        bits: "6:0"
        access: rw
        confirmed: true
        description: "Sequencer address."
  - name: FILTER
    addr: 0x08
    width: 1
    access: rw
    reset: 0x00
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.45"
    description: "Digital filter type and data-rate index (Tables 9a-9d)."
    fields:
      - name: RESERVED
        bits: "6"
        access: rw
        confirmed: true
        description: "Reserved; always write 0."
      - name: LINEF
        bits: "5:4"
        access: rw
        confirmed: true
        description: "Filter type."
        values:
          "FIR5060": 0
          "FIR50": 1
          "FIR60": 2
          "SINC4": 3
      - name: RATE
        bits: "3:0"
        access: rw
        confirmed: true
        description: "Data-rate index; meaning depends on LINEF and conversion type."
  - name: CTRL
    addr: 0x09
    width: 1
    access: rw
    reset: 0x01
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.45"
    description: "Clock source, input range, data format, reference buffers, reference select."
    fields:
      - name: EXTCLK
        bits: "7"
        access: rw
        confirmed: true
        description: "System clock source."
        values:
          "INTERNAL": 0
          "EXTERNAL": 1
      - name: U_BN
        bits: "6"
        access: rw
        confirmed: true
        aliases: [UNIPOLAR]
        description: "Input range. Unipolar data is always straight binary."
        values:
          "BIPOLAR": 0
          "UNIPOLAR": 1
      - name: FORMAT
        bits: "5"
        access: rw
        confirmed: true
        description: "Bipolar data format (no effect in unipolar mode)."
        values:
          "TWOS_COMPLEMENT": 0
          "OFFSET_BINARY": 1
      - name: REFBUFP_EN
        bits: "4"
        access: rw
        confirmed: true
        aliases: [VREFP_BUF]
        description: "Enable the reference P-side buffer."
      - name: REFBUFN_EN
        bits: "3"
        access: rw
        confirmed: true
        aliases: [VREFN_BUF]
        description: "Enable the reference N-side buffer."
      - name: REF_SEL
        bits: "2:0"
        access: rw
        confirmed: true
        aliases: [REFSEL]
        description: "Reference. 0: AIN0(REF0P)/AIN1(REF0N); 4-6 single-ended to AGND; 3 and 7 both AVDD/AGND."
        values:
          "REF0": 0
          "REF1": 1
          "REF2": 2
          "AVDD": 3
          "REF0P_AGND": 4
          "REF1P_AGND": 5
          "REF2P_AGND": 6
          "AVDD_ALT": 7
  - name: SOURCE
    addr: 0x0A
    width: 1
    access: rw
    reset: 0x00
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.47"
    description: "VBIAS mode, burnout current, matched IDAC current. IDAC and VBIAS on the same input are mutually exclusive (enabling one clears the other)."
    fields:
      - name: VBIAS_MODE
        bits: "7:6"
        access: rw
        confirmed: true
        description: "AVDD/2 bias source."
        values:
          "ACTIVE": 0
          "HIGH_Z_125K": 1
          "LOW_Z_20K": 2
          "LOW_Z_20K_ALT": 3
      - name: BRN_MODE
        bits: "5:4"
        access: rw
        confirmed: true
        description: "Burnout current sources."
        values:
          "OFF": 0
          "UA_0P5": 1
          "UA_1": 2
          "UA_10": 3
      - name: IDAC_MODE
        bits: "3:0"
        access: rw
        confirmed: true
        description: "Matched excitation current."
        values:
          "UA_10": 0
          "UA_50": 1
          "UA_75": 2
          "UA_100": 3
          "UA_125": 4
          "UA_150": 5
          "UA_175": 6
          "UA_200": 7
          "UA_225": 8
          "UA_250": 9
          "UA_300": 10
          "UA_400": 11
          "UA_600": 12
          "UA_800": 13
          "UA_1200": 14
          "UA_1600": 15
  - name: MUX_CTRL0
    addr: 0x0B
    width: 1
    access: rw
    reset: 0xFF
    reset_source: datasheet
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.48"
    description: "Input multiplexer. 11-15 = unconnected (reset)."
    notes: "EVKIT read 0x2A only because it had been written; not a reset value."
    fields:
      - name: AINP_SEL
        bits: "7:4"
        access: rw
        confirmed: true
        aliases: [AINP]
        description: "Positive input."
        values:
          "AIN0": 0
          "AIN1": 1
          "AIN2": 2
          "AIN3": 3
          "AIN4": 4
          "AIN5": 5
          "AIN6": 6
          "AIN7": 7
          "AIN8": 8
          "AIN9": 9
          "AVDD": 10
          "NC": 15
      - name: AINN_SEL
        bits: "3:0"
        access: rw
        confirmed: true
        aliases: [AINN]
        description: "Negative input."
        values:
          "AIN0": 0
          "AIN1": 1
          "AIN2": 2
          "AIN3": 3
          "AIN4": 4
          "AIN5": 5
          "AIN6": 6
          "AIN7": 7
          "AIN8": 8
          "AIN9": 9
          "GND": 10
          "NC": 15
  - name: MUX_CTRL1
    addr: 0x0C
    width: 1
    access: rw
    reset: 0xFF
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.49"
    description: "Matched IDAC outputs. 10-15 = unconnected, IDAC powered down (reset)."
    fields:
      - name: IDAC1_SEL
        bits: "7:4"
        access: rw
        confirmed: true
        description: "IDAC1 output pin."
        values:
          "AIN0": 0
          "AIN1": 1
          "AIN2": 2
          "AIN3": 3
          "AIN4": 4
          "AIN5": 5
          "AIN6": 6
          "AIN7": 7
          "AIN8": 8
          "AIN9": 9
          "OFF": 15
      - name: IDAC0_SEL
        bits: "3:0"
        access: rw
        confirmed: true
        description: "IDAC0 output pin."
        values:
          "AIN0": 0
          "AIN1": 1
          "AIN2": 2
          "AIN3": 3
          "AIN4": 4
          "AIN5": 5
          "AIN6": 6
          "AIN7": 7
          "AIN8": 8
          "AIN9": 9
          "OFF": 15
  - name: MUX_CTRL2
    addr: 0x0D
    width: 1
    access: rw
    reset: 0x00
    reset_source: hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.50"
    description: "VBIAS switch per input AIN0-AIN7 (several may be on)."
    fields:
      - name: VBIAS_SEL_7
        bits: "7"
        access: rw
        confirmed: true
        description: "Connect VBIAS to AIN7."
      - name: VBIAS_SEL_6
        bits: "6"
        access: rw
        confirmed: true
        description: "Connect VBIAS to AIN6."
      - name: VBIAS_SEL_5
        bits: "5"
        access: rw
        confirmed: true
        description: "Connect VBIAS to AIN5."
      - name: VBIAS_SEL_4
        bits: "4"
        access: rw
        confirmed: true
        description: "Connect VBIAS to AIN4."
      - name: VBIAS_SEL_3
        bits: "3"
        access: rw
        confirmed: true
        description: "Connect VBIAS to AIN3."
      - name: VBIAS_SEL_2
        bits: "2"
        access: rw
        confirmed: true
        description: "Connect VBIAS to AIN2."
      - name: VBIAS_SEL_1
        bits: "1"
        access: rw
        confirmed: true
        description: "Connect VBIAS to AIN1."
      - name: VBIAS_SEL_0
        bits: "0"
        access: rw
        confirmed: true
        description: "Connect VBIAS to AIN0."
  - name: PGA
    addr: 0x0E
    width: 1
    access: rw
    reset: 0x00
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.51"
    description: "Signal path and gain. With the buffered or bypass path GAIN is a digital gain and settings above 4x act as 4x."
    fields:
      - name: SIG_PATH
        bits: "5:4"
        access: rw
        confirmed: true
        description: "Signal path. 3 is reserved."
        values:
          "BUFFERED": 0
          "BYPASS": 1
          "PGA": 2
      - name: GAIN
        bits: "2:0"
        access: rw
        confirmed: true
        description: "Gain = 2^GAIN."
        values:
          "X1": 0
          "X2": 1
          "X4": 2
          "X8": 3
          "X16": 4
          "X32": 5
          "X64": 6
          "X128": 7
