    addr: 0x0F
    width: 1
    access: rw
    reset: 0x00
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.52"
    description: "Wait extension: wait clocks = (WAIT_EXT*16)*(WAIT*16), or WAIT*16 when 0."
    fields:
      - name: WAIT_EXT
        bits: "7:0"
        access: rw
        confirmed: true
        description: "Wait extension multiplier."
  - name: WAIT_START
    addr: 0x10
    width: 1
    access: rw
    reset: 0x00
    reset_source: hardware
    reset_confirmed: true
    confirmed: true
    volatile: true
    trigger: true
    source: "datasheet rev3 p.52"
    description: "Writing WAIT starts a wait of (WAIT_EXT*16)*(WAIT*16) clocks (2.4576 MHz nominal: 6.5 us .. 6.77 s); reading returns the remaining count; 0 = no-op. Writing it while in standby/sleep wakes the part (PD -> normal) first."
    fields:
      - name: WAIT
        bits: "7:0"
        access: rw
        confirmed: true
        description: "Wait count."
  - name: PART_ID
    addr: 0x11
    width: 3
    access: r
    reset: 0x000F02
    reset_source: hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.57"
    description: "Part / silicon revision ID; reads 0x000F02 on the EVKIT."
    notes: "Datasheet only defines REV_ID[2:0]; bits 23:3 are shown as '-'."
    fields:
      - name: REV_ID
        bits: "2:0"
        access: r
        confirmed: true
        description: "Silicon revision ID."
  - name: SYSC_SEL
    addr: 0x12
    width: 3
    access: rw
    reset: 0x000000
    reset_source: datasheet+hardware
    reset_confirmed: true
    confirmed: true
    source: "datasheet rev3 p.58"
