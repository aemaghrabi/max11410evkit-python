        access: rw
        confirmed: true
        description: "System calibration for DATA6."
        values:
          "A": 0
          "B": 1
          "NONE": 2
          "NONE_ALT": 3
      - name: SYSC_SEL_5
        bits: "11:10"
        access: rw
        confirmed: true
        description: "System calibration for DATA5."
        values:
          "A": 0
          "B": 1
          "NONE": 2
          "NONE_ALT": 3
      - name: SYSC_SEL_4
        bits: "9:8"
        access: rw
        confirmed: true
        description: "System calibration for DATA4."
        values:
          "A": 0
          "B": 1
          "NONE": 2
          "NONE_ALT": 3
      - name: SYSC_SEL_3
        bits: "7:6"
        access: rw
        confirmed: true
        description: "System calibration for DATA3."
        values:
          "A": 0
          "B": 1
          "NONE": 2
          "NONE_ALT": 3
      - name: SYSC_SEL_2
        bits: "5:4"
        access: rw
        confirmed: true
        description: "System calibration for DATA2."
